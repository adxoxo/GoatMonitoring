# =====================================================================
# GoatedTracking — PRODUCTION stack
#
#   docker compose up -d
#
# Services: PostgreSQL, Django/Gunicorn, frontend build, Nginx reverse proxy.
# Everything stays on the farm LAN. Nginx is the only exposed port (80).
# Dev workflow lives in docker-compose.dev.yml.
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: goatfarm_db
    # Reads POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD from backend/.env
    env_file: backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only reachable inside the Docker network.
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: goatfarm_backend
    # Migrations + collectstatic run in docker-entrypoint.sh, then Gunicorn.
    env_file: backend/.env
    volumes:
      - ./backend/media:/app/media
      - static_files:/app/static/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Multi-stage build compiles the SPA, then copies dist/ into the shared
    # `frontend_dist` volume that Nginx serves. Container exits 0 once copied.
    build: ./frontend
    container_name: goatfarm_frontend
    volumes:
      - frontend_dist:/dist
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: goatfarm_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - ./backend/media:/media:ro
      - static_files:/static:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dist:
  static_files:
