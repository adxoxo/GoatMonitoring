# =====================================================================
# GoatedTracking — Nginx reverse proxy (production)
#
# One entry point on the farm LAN (port 80):
#   /            → React SPA (admin dashboard + worker QR view, incl. /g/{uuid})
#   /api/        → Django/Gunicorn
#   /media/      → QR images and uploads (served directly, no app processing)
#   /static/     → Django collected static
#   /django-admin/ → Django admin (emergency access only, never linked in UI)
# =====================================================================

upstream goatfarm_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name goatfarm.local localhost;

    # Goat health logs are tiny; cap uploads to keep the server safe on LAN.
    client_max_body_size 10m;

    # gzip text assets — helps the worker PWA load fast on phones over WiFi.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── React SPA ────────────────────────────────────────────────────
    # try_files falls back to index.html so client-side routes such as
    # /g/{uuid} (worker QR scan) resolve to the SPA.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://goatfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── QR images and uploaded media ─────────────────────────────────
    location /media/ {
        alias /media/;
        expires 30d;
        access_log off;
    }

    # ── Django collected static (admin assets, etc.) ─────────────────
    location /static/ {
        alias /static/;
        expires 30d;
        access_log off;
    }

    # ── Django admin — emergency raw-data access only ────────────────
    location /django-admin/ {
        proxy_pass http://goatfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
